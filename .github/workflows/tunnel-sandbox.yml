name: Simple Tunnel
on: 
  workflow_dispatch:
    inputs:
      port:
        description: 'Port to tunnel'
        required: false
        default: '8080'

jobs:
  tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Start HTTP server
        run: |
          python3 -m http.server ${{ inputs.port }} &
          
      - name: Install bore
        run: |
          curl -L https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv bore /usr/local/bin/
          
      - name: Create tunnel
        run: |
          echo "✅ Tunnel URL:"
          bore local ${{ inputs.port }} --to bore.pub
