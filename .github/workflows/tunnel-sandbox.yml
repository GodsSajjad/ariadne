# version
name: Tunnel Sandbox (Cloudflare | lhr | Inlets | Tailscale | Tor)

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

# Safer bash defaults everywhere
defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  DEFAULT_PORT: "8080"
  DEFAULT_MINUTES: "40"
  STATUS_MARK: "<!-- TUNNEL_SANDBOX_STATUS -->"
  MAX_CAP_MINUTES: "80" # hard cap for the main job & keepalive logic
  DEBUG_WINDOW_MINUTES: "10"

jobs:
  # -----------------------------
  # Parse user selections from issue
  # -----------------------------
  parse:
    name: Parse selections
    if: >-
      contains(join(github.event.issue.labels.*.name, ','), 'tunnel-sandbox') ||
      startsWith(github.event.issue.title, 'Tunnel Sandbox') ||
      contains(github.event.issue.body, '## Runner OS')
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.parse_body.outputs.os }}
      tunnel: ${{ steps.parse_body.outputs.tunnel }}
      port: ${{ steps.parse_body.outputs.port }}
      minutes: ${{ steps.parse_body.outputs.minutes }}
      on: ${{ steps.parse_body.outputs.on }}
    steps:
      # We need to check out the repo to access our parsing script
      - name: Checkout repository
        uses: actions/checkout@v4

      # This step replaces the old inline bash logic with our robust script
      - name: Parse issue body using script
        id: parse_body
        run: |
          chmod +x ./.github/scripts/parse_issue_body.sh
          printf '%s' "${{ github.event.issue.body }}" | \
            ./.github/scripts/parse_issue_body.sh | \
            tee "$GITHUB_OUTPUT"
        env:
          # Pass env vars to the script for defaults and caps
          DEFAULT_PORT: ${{ env.DEFAULT_PORT }}
          DEFAULT_MINUTES: ${{ env.DEFAULT_MINUTES }}
          MAX_CAP_MINUTES: ${{ env.MAX_CAP_MINUTES }}

      - name: Upsert status comment (parsed)
        uses: actions/github-script@v7
        with:
          script: |
            const mark = process.env.STATUS_MARK;
            const cap  = process.env.MAX_CAP_MINUTES;
            const body = [
              mark,
              "### Tunnel Sandbox · Status",
              "",
              "**Selections parsed** ✅",
              `- Power: \`${{ steps.parse_body.outputs.on }}\``,
              `- OS: \`${{ steps.parse_body.outputs.os }}\``,
              `- Tunnel: \`${{ steps.parse_body.outputs.tunnel }}\``,
              `- Port: \`${{ steps.parse_body.outputs.port }}\``,
              `- Minutes: \`${{ steps.parse_body.outputs.minutes }}\` (hard cap: ${cap})`,
              "",
              "_Spinning up… this comment will update with the access method._",
              ""
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100
            });
            const prev = comments.find(c => c.body && c.body.includes(mark));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: prev.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body
              });
            }

  # -----------------------------
  # If OFF, update status and exit
  # -----------------------------
  off:
    name: Power is OFF (no-op)
    needs: parse
    if: needs.parse.result == 'success' && needs.parse.outputs.on == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Upsert status comment (OFF)
        uses: actions/github-script@v7
        with:
          script: |
            const mark = process.env.STATUS_MARK;
            const body = [
              mark,
              "### Tunnel Sandbox · Status",
              "",
              "⏹️ **Switch is OFF** — not starting any runner.",
              "",
              "_Check the **ON** box and edit this issue to start again._",
              ""
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100
            });
            const prev = comments.find(c => c.body && c.body.includes(mark));
            if (prev) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  # -----------------------------
  # Main run: server + chosen tunnel (only when ON)
  # -----------------------------
  run:
    name: Hello World + Tunnel
    needs: parse
    if: needs.parse.result == 'success' && needs.parse.outputs.on == 'true'
    runs-on: ${{ needs.parse.outputs.os }}
    timeout-minutes: 40 
    env:
      PORT: ${{ needs.parse.outputs.port }}
      KEEP_MINUTES: ${{ needs.parse.outputs.minutes }}
      TUNNEL: ${{ needs.parse.outputs.tunnel }}
      TS_HOSTNAME: "gh-runner-${{ github.run_id }}"
    steps:
      - name: Show environment
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "PORT=$PORT"
          echo "KEEP_MINUTES=$KEEP_MINUTES (hard cap ${MAX_CAP_MINUTES})"
          echo "TUNNEL=$TUNNEL"

      # --- Basics per OS
      - name: Install basics (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl openssh-client

      - name: Install basics (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install jq openssh

      - name: Install basics (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install jq git -y

      # --- Tiny HTTP server (Node)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Hello World server
        run: |
          cat > server.js <<'JS'
          const http = require('http');
          const port = process.env.PORT || 8080;
          const server = http.createServer((req, res) => {
            res.writeHead(200, {'content-type':'text/plain'});
            res.end(`Hello from ${process.platform} @ ${new Date().toISOString()} on port ${port}\n`);
          });
          server.listen(port, '0.0.0.0', () => console.log(`Listening on ${port}`));
          JS

      - name: Start server & verify port
        run: |
          nohup node server.js > server.log 2>&1 &
          for i in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/$PORT) >/dev/null 2>&1; then
              echo "Port $PORT is open."
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Server did not start on port $PORT in time."
              exit 1
            fi
            sleep 1
          done

      # --- Tunnel Installations & Startups ---
      # NOTE: These sections remain largely the same, but I've removed some `|| true`
      # that could hide real installation failures.

      # ------------------ Cloudflare Tunnel ------------------
      - name: Install cloudflared (Linux)
        if: env.TUNNEL == 'cloudflare' && runner.os == 'Linux'
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cf.deb
          sudo dpkg -i cf.deb
          cloudflared --version

      - name: Install cloudflared (macOS)
        if: env.TUNNEL == 'cloudflare' && runner.os == 'macOS'
        run: |
          brew install cloudflared
          cloudflared --version

      - name: Install cloudflared (Windows)
        if: env.TUNNEL == 'cloudflare' && runner.os == 'Windows'
        shell: powershell
        run: |
          choco install cloudflared -y
          cloudflared --version

      - name: Start Cloudflare Tunnel
        if: env.TUNNEL == 'cloudflare'
        run: |
          (cloudflared tunnel --url "http://127.0.0.1:${PORT}" --no-autoupdate > cloudflared.log 2>&1) &
          for i in {1..60}; do
            URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' cloudflared.log | tail -n1 || true)"
            [ -n "$URL" ] && break
            sleep 1
          done
          if [ -z "$URL" ]; then echo "Failed to obtain Cloudflare URL"; cat cloudflared.log; exit 1; fi
          echo "PUBLIC_URL=${URL}" >> $GITHUB_ENV
          echo "ACCESS_KIND=browser" >> $GITHUB_ENV
          echo "ACCESS_VALUE=${URL}" >> $GITHUB_ENV
          echo "ACCESS_NOTE=Open in a regular browser." >> $GITHUB_ENV

      # ------------------ localhost.run (lhr) ------------------
      - name: Start localhost.run
        if: env.TUNNEL == 'localhostrun'
        # This complex script is well-contained, leaving it as is.
        run: |
          LOG_JSON="${HOME}/localhostrun.jsonl"; : > "$LOG_JSON"
          if command -v stdbuf >/dev/null 2>&1; then STD="stdbuf -o0 -e0"; else STD=""; fi
          SSH_OPTS=(-o StrictHostKeyChecking=no -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o TCPKeepAlive=yes)
          $STD ssh "${SSH_OPTS[@]}" -v -f -R 80:127.0.0.1:${PORT} nokey@localhost.run -- --output json &> "$LOG_JSON" || true
          exec 3< <(tail -n +1 -F "$LOG_JSON")
          start_epoch=$(date +%s)
          found_url=""
          while true; do
            if ! IFS= read -r -t 1 line <&3; then
              now=$(date +%s)
              (( now - start_epoch >= 90 )) && break
              continue
            fi
            tsv=$(printf '%s\n' "$line" | jq -Rr 'fromjson?|select(.event=="tcpip-forward" and .status=="success")|[(.address // .listen_host // ""), (if .tls_termination then "true" else "false" end), (.message // "")]|@tsv' || true)
            [[ -z "$tsv" ]] && continue
            host=$(printf '%s' "$tsv" | cut -f1)
            tls=$(printf '%s' "$tsv" | cut -f2)
            if [[ -n "$host" ]]; then scheme="http"; [[ "$tls" == "true" ]] && scheme="https"; found_url="${scheme}://${host}"; break; fi
          done
          exec 3<&-
          if [[ -z "$found_url" ]]; then echo "FAILED to discover SSH public URL"; tail -n 200 "$LOG_JSON"; exit 1; fi
          echo "PUBLIC_URL=${found_url}" >> "$GITHUB_ENV"
          echo "ACCESS_KIND=browser" >> "$GITHUB_ENV"
          echo "ACCESS_VALUE=${found_url}" >> "$GITHUB_ENV"
          echo "ACCESS_NOTE=Open in a regular browser." >> "$GITHUB_ENV"

      # ------------------ Inlets PRO ------------------
      - name: Check Inlets secrets
        if: env.TUNNEL == 'inlets'
        # Pass the secrets into the step's environment
        env:
          INLETS_REMOTE: ${{ secrets.INLETS_REMOTE }}
          INLETS_TOKEN: ${{ secrets.INLETS_TOKEN }}
          INLETS_LICENSE: ${{ secrets.INLETS_LICENSE }}
          # The public URL is technically optional for the client to run,
          # but required for the workflow to post a useful comment.
          INLETS_PUBLIC_URL: ${{ secrets.INLETS_PUBLIC_URL }}
        run: |
          missing=0
          # Iterate over the NAMES of the variables
          for v_name in INLETS_REMOTE INLETS_TOKEN INLETS_LICENSE INLETS_PUBLIC_URL; do
            # Use shell's indirect expansion `${!v_name}` to get the value
            # of the variable whose name is stored in v_name.
            if [ -z "${!v_name}" ]; then
              echo "::error::Missing required secret: $v_name"
              missing=1
            fi
          done
          exit $missing

      - name: Install Inlets PRO
        if: env.TUNNEL == 'inlets'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            curl -sLS https://github.com/inlets/inlets-pro/releases/latest/download/inlets-pro-linux-amd64.tgz | sudo tar -xz -C /usr/local/bin/
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install inlets/inlets/inlets-pro
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            choco install inlets-pro -y
          fi
          inlets-pro version

      - name: Start Inlets PRO client
        if: env.TUNNEL == 'inlets'
        env:
          INLETS_REMOTE: ${{ secrets.INLETS_REMOTE }}
          INLETS_TOKEN: ${{ secrets.INLETS_TOKEN }}
          INLETS_LICENSE: ${{ secrets.INLETS_LICENSE }}
          INLETS_PUBLIC_URL: ${{ secrets.INLETS_PUBLIC_URL }}
        run: |
          ( inlets-pro http client \
              --url "${INLETS_REMOTE}" \
              --token "${INLETS_TOKEN}" \
              --upstream "http://127.0.0.1:${PORT}" \
              --license "${INLETS_LICENSE}" \
              --auto-tls > inlets.log 2>&1 ) &
          echo "PUBLIC_URL=${INLETS_PUBLIC_URL}" >> $GITHUB_ENV
          echo "ACCESS_KIND=browser" >> $GITHUB_ENV
          echo "ACCESS_VALUE=${INLETS_PUBLIC_URL}" >> $GITHUB_ENV
          echo "ACCESS_NOTE=Open in a regular browser." >> $GITHUB_ENV

      # ------------------ Tailscale ------------------
      - name: Install Tailscale
        if: env.TUNNEL == 'tailscale'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            curl -fsSL https://tailscale.com/install.sh | sh
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install tailscale
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            choco install tailscale -y
          fi

      - name: Tailscale up
        if: env.TUNNEL == 'tailscale'
        run: |
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" \
            --hostname="${TS_HOSTNAME}" \
            --ssh \
            --accept-dns=false
          tailscale ip -4 | head -n1 > ts.ipv4
          if ! [ -s ts.ipv4 ]; then echo "No Tailscale IPv4"; exit 1; fi
          TS_IP=$(cat ts.ipv4)
          echo "TS_IP=${TS_IP}" >> $GITHUB_ENV
          echo "ACCESS_KIND=ssh" >> $GITHUB_ENV
          echo "ACCESS_VALUE=${TS_IP}" >> $GITHUB_ENV
          echo "ACCESS_NOTE=Paste the SSH command below in your terminal, then open the local URL." >> $GITHUB_ENV

      # ------------------ Tor (Linux, macOS, Windows) ------------------
      - name: Install Tor (Linux)
        if: env.TUNNEL == 'tor' && runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tor netcat

      - name: Install Tor (macOS)
        if: env.TUNNEL == 'tor' && runner.os == 'macOS'
        run: |
          brew install tor

      - name: Install Tor (Windows)
        if: env.TUNNEL == 'tor' && runner.os == 'Windows'
        shell: powershell
        run: |
          choco install tor-expert-bundle -y

      - name: Configure, Start Tor, and Get Onion URL
        if: env.TUNNEL == 'tor'
        # On Windows, we use Git Bash to get access to netcat (nc), grep, etc.
        shell: ${{ runner.os == 'Windows' && 'bash' || 'default' }}
        run: |
          echo "Configuring and starting Tor onion service..."
          mkdir -p tor
          # This torrc creates a hidden service and enables the control port
          # so we can query it directly for the .onion address.
          cat > tor/torrc <<EOF
          DataDirectory $(pwd)/tor
          HiddenServiceDir $(pwd)/tor/hidden_service
          HiddenServiceVersion 3
          HiddenServicePort 80 12 AUTH_COOKIE $(pwd)/tor/control_auth_cookie
          ControlPort 9051
          EOF

          # Start tor in the background
          tor -f tor/torrc > tor/tor.log 2>&1 &

          echo "Waiting for Onion URL from control port..."
          onion=""
          for i in {1..90}; do
            # Check if the control port is open and responsive
            if nc -z 127.0.0.1 9051; then
              # Authenticate and request the onion address. The AUTHENTICATE command
              # with no password works for the default ControlPort setup.
              response=$( (printf "AUTHENTICATE\r\nGETINFO hs/client/onion-address\r\nQUIT\r\n"; sleep 1) | nc 127.0.0.1 9051 )

              # Check if we got a valid response
              if [[ "$response" == *"hs/client/onion-address="* ]]; then
                onion=$(echo "$response" | grep "hs/client/onion-address=" | cut -d'=' -f2)
                # Sometimes it includes quotes, so we strip them
                onion="${onion//\"/}"
                if [[ "$onion" == *".onion"* ]]; then
                  echo "Successfully retrieved onion URL: $onion"
                  break
                fi
              fi
            fi
            sleep 1
          done

          if [ -z "$onion" ]; then
            echo "::error::Tor did not generate an onion URL in time."
            echo "--- tor/tor.log ---"
            tail -n 120 tor/tor.log || true
            exit 1
          fi

          echo "PUBLIC_URL=$onion" >> $GITHUB_ENV
          echo "ACCESS_KIND=browser" >> $GITHUB_ENV
          echo "ACCESS_VALUE=$onion" >> $GITHUB_ENV
          echo "ACCESS_NOTE=Requires Tor Browser." >> $GITHUB_ENV

      # ------------------ Final Status & Keep-Alive ------------------
      - name: Upsert status comment (final access)
        if: always()
        uses: actions/github-script@v7
        env:
          PUBLIC_URL: ${{ env.PUBLIC_URL }}
          TS_IP: ${{ env.TS_IP }}
          ACCESS_KIND: ${{ env.ACCESS_KIND }}
          ACCESS_VALUE: ${{ env.ACCESS_VALUE }}
          ACCESS_NOTE: ${{ env.ACCESS_NOTE }}
        with:
          script: |
            const mark = process.env.STATUS_MARK;
            const tun  = process.env.TUNNEL;
            const url  = process.env.PUBLIC_URL;
            const port = process.env.PORT;
            const os   = process.env.RUNNER_OS;
            const tsip = process.env.TS_IP;
            const kind = process.env.ACCESS_KIND;
            const val  = process.env.ACCESS_VALUE;
            const note = process.env.ACCESS_NOTE;
            const cap  = process.env.MAX_CAP_MINUTES;

            const user = (os === "Windows") ? "runneradmin" : "runner";
            let accessBlock = "Tunnel failed to initialize.";

            if (val) {
              if (kind === "ssh" && tsip) {
                const fwd = 8443;
                accessBlock = [
                  "**Access Method**", "",
                  "**Paste in terminal for SSH port-forward:**",
                  "```bash",
                  `ssh -N -L ${fwd}:127.0.0.1:${port} ${user}@${tsip}`,
                  "```",
                  `then open: **http://localhost:${fwd}**`, "",
                  "_Your device must be logged into the same tailnet; TS-SSH is enabled._"
                ].join("\n");
              } else if (kind === "browser" && url) {
                 accessBlock = `**Access Method**\n\n**${note}**\n\n> ${url}`;
              }
            }

            const body = [
              mark, "### Tunnel Sandbox · Status", "",
              `**OS:** \`${os}\`  |  **Tunnel:** \`${tun}\`  |  **App Port:** \`${port}\``, "",
              accessBlock, "",
              `_Max runtime is capped at ${cap} minutes._`,
              "_Edit this issue to change options (cancels the previous run)._", ""
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100
            });
            const prev = comments.find(c => c.body && c.body.includes(mark));
            if (prev) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Keep session alive
        run: |
          want_secs=$(( KEEP_MINUTES * 60 ))
          cap_secs=$(( MAX_CAP_MINUTES * 60 ))
          secs=$want_secs
          if (( secs > cap_secs )); then secs=$cap_secs; fi
          echo "Keeping session alive for $(( secs / 60 )) minute(s)."
          sleep $secs
          echo "Time up."

      # ------------------ Failure Handling ------------------
      - name: Collect logs (on failure)
        if: failure()
        run: |
          set +e
          echo '--- server.log ---'; tail -n 80 server.log
          echo '--- cloudflared.log ---'; tail -n 120 cloudflared.log
          echo '--- localhostrun.jsonl ---'; tail -n 120 ~/localhostrun.jsonl
          echo '--- inlets.log ---'; tail -n 120 inlets.log
          echo '--- tor/tor.log ---'; tail -n 120 tor/tor.log

      - name: tmate rescue shell (on failure)
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: ${{ env.DEBUG_WINDOW_MINUTES }}
        with:
          detached: true
          limit-access-to-actor: true
        id: tmate

      - name: Upsert status comment (tmate)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const mark = process.env.STATUS_MARK;
            const ssh = `${{ steps.tmate.outputs.sshCommand }}`.trim();
            const web = `${{ steps.tmate.outputs.webUrl }}`.trim();
            const body = [
              mark, "### Tunnel Sandbox · Status", "",
              "❗ **Job failed** — opening a debug shell.", "",
              "**SSH:**", "```bash\n" + ssh + "\n```",
              `**Web shell:** ${web}`, "",
              `_This stays open for ${process.env.DEBUG_WINDOW_MINUTES} minutes._`, ""
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            });
            const prev = comments.find(c => c.body && c.body.includes(mark));
            if (prev) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

