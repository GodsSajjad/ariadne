name: Tunnel Sandbox
description: Spin up a Hello World server and expose it via a chosen tunnel.
title: "[Sandbox]"
labels: ["tunnel-sandbox"]
assignees: ''

body:
  - type: markdown
    attributes:
      value: |
        ## 🚀 Ariadne Tunnel Sandbox
        *Create a variety of tunnels into GitHub Actions runners to serve web content.*

        **Select your configuration below and click "Submit new issue" to start. The action will re-run each time you edit and save your selections.**

  - type: dropdown
    id: runner-os
    attributes:
      label: "1. Runner OS"
      description: "Pick the operating system for the runner."
      options:
        - Ubuntu (ubuntu-latest)
        - macOS (macos-14)
        - Windows (windows-latest)
    validations:
      required: true

  - type: dropdown
    id: tunnel
    attributes:
      label: "2. Tunnel"
      description: "Pick the tunneling service to use."
      options:
        - Cloudflare Tunnel
        - localhost.run
        - Tailscale
        - Tor
    validations:
      required: true

  - type: markdown
    attributes:
      value: "---"

  - type: input
    id: port
    attributes:
      label: "3. Port (Optional)"
      description: "The port the Hello World server will listen on. Overrides default (8080)."
      placeholder: "8080"
    validations:
      required: false

  - type: input
    id: minutes
    attributes:
      label: "4. Minutes to Run (Optional)"
      description: "The number of minutes to keep the runner alive. Overrides default (40), max is 80."
      placeholder: "40"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        <details>
          <summary>Troubleshooting and More Information</summary>
          
          > **What is this?**
          > Open this issue, make your selections, and the workflow will spin up a short-lived test server on a GitHub Actions runner and expose it via the tunnel you chose.

          > **What happens next?**
          > After you submit, the bot comments a status block that includes your access link or SSH command. If something fails, it automatically opens a private tmate shell for you.

          ### Tunneling Access Overview

          | Option              | Public link?                  | Setup (Runner → User)                     | Typical perf    | Reliability/NAT      | Privacy / Exposure                  | Best for                   |
          |---------------------|-------------------------------|-------------------------------------------|-----------------|----------------------|-------------------------------------|----------------------------|
          | **Cloudflare Tunnel** | Yes (`*.trycloudflare.com`)   | Auto-install client → you click URL       | Good–very good  | High                 | Public at edge; origin stays private| Quick public demos         |
          | **localhost.run**   | Yes (`http(s)://…lhr.life`)   | SSH reverse tunnel → we scrape URL        | OK–good         | Medium (shared infra)| Public at edge                      | Fast, zero-config link     |
          | **Inlets PRO**      | Yes (your controller)         | Client connects to your inlets server     | Very good       | High (you control edge)| Public via your infra; TLS options  | Prod-like, your domain     |
          | **Tailscale**       | No public URL                 | Runner joins tailnet → you SSH port-forward| LAN-like, low-latency | Very high (P2P/NAT-punch) | Private to tailnet                | Private evals / team-only  |
          | **Tor**             | Yes (`.onion`)                | Local hidden service → onion URL          | Variable (high latency) | High               | Pseudonymous; Tor-only              | Privacy-focused access     |

          > **Notes:**
          > • **Tailscale** requires you (and testers) to be on the same tailnet; we comment a ready `ssh -L ...` command.
          > • **Inlets PRO** needs secrets for your controller.
          > • **Tor** requires Tor Browser to visit `.onion` URLs.

        </details>
